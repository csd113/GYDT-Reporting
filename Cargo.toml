[package]
name = "gydt-results-compiler"
version = "1.0.0"
edition = "2024"
rust-version = "1.100.0"

[features]
public-demo = []

[dependencies]
base64 = "0.22.1"
gamut-core = "2.0.1"
gamut-jpeg = "0.1.0"
getrandom = { version = "0.4.3", features = ["std"] }
jiff = { version = "0.2.46", default-features = false, features = ["std", "tzdb-bundle-always"] }
quoted_printable = "0.5.2"
roxmltree = "0.21.1"
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
uuid = { version = "1.29.2", features = ["serde"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
directories = "6.0.0"
eframe = { version = "0.34.3", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
oxiarc-jpeg = { version = "=0.4.2", default-features = false, features = ["arithmetic"] }
resvg = { version = "0.47.0", default-features = false }
rfd = { version = "0.17.2", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
winit = { version = "=0.30.13", default-features = false }
winsafe = { version = "=0.0.29", features = ["user"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_dependencies = "deny"
