name: Desktop validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --all-features
      - name: Build the profile-required Windows x64 ZIP
        shell: pwsh
        run: ./windows/build-app.ps1 (Join-Path $env:RUNNER_TEMP 'GYDT-Sample-Reporting-v1.0.6-windows-x64.zip')
      - name: Verify the app ZIP and embedded camera executable
        shell: pwsh
        run: python -B -c "import sys; from pathlib import Path; sys.path.insert(0, 'scripts'); from release_preflight import check_zip; check_zip(Path(sys.argv[1]), 1, '1.0.6')" (Join-Path $env:RUNNER_TEMP 'GYDT-Sample-Reporting-v1.0.6-windows-x64.zip')

      - name: Retain the verified windows-x64 ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gydt-windows-x64
          path: ${{ runner.temp }}/GYDT-Sample-Reporting-v1.0.6-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  macos:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --all-features
      - name: Build the profile-required Apple Silicon ZIP
        run: ./macos/build-app.sh "$RUNNER_TEMP/GYDT-Sample-Reporting-v1.0.6-macos-arm64.zip"
      - name: Verify the Apple Silicon app ZIP
        run: python3 -B -c "import sys; from pathlib import Path; sys.path.insert(0, 'scripts'); from release_preflight import check_zip; check_zip(Path(sys.argv[1]), 0, '1.0.6')" "$RUNNER_TEMP/GYDT-Sample-Reporting-v1.0.6-macos-arm64.zip"

      - name: Retain the verified macos-arm64 ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gydt-macos-arm64
          path: ${{ runner.temp }}/GYDT-Sample-Reporting-v1.0.6-macos-arm64.zip
          if-no-files-found: error
          retention-days: 7

  production-importer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B scripts/test_release_preflight.py
      - name: Verify PHP CLI with GD and mysqli
        run: |
          if ! php -r 'exit(extension_loaded("gd") && extension_loaded("mysqli") ? 0 : 1);'; then
            sudo apt-get update
            sudo apt-get install -y php-cli php-gd php-mysql
          fi
          php -r 'exit(extension_loaded("gd") && extension_loaded("mysqli") ? 0 : 1);'
      - name: Build and test the production importer
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/csd113/GYDT-Reporting/releases/download/v1.0.2/GYDT-Sample-Results-Importer-v1.0.2.zip \
            --output "$RUNNER_TEMP/importer-v1.0.2.zip"
          ./wordpress/build-production-plugin.sh "$RUNNER_TEMP/importer-v1.0.2.zip" "$RUNNER_TEMP/GYDT-Sample-Results-Importer-v1.0.6.zip"
          ./wordpress/tests/check-production-plugin.sh "$RUNNER_TEMP/GYDT-Sample-Results-Importer-v1.0.6.zip"
      - name: Verify the production importer ZIP
        run: python3 -B -c "import sys; from pathlib import Path; sys.path.insert(0, 'scripts'); from release_preflight import check_zip; check_zip(Path(sys.argv[1]), 2, '1.0.6')" "$RUNNER_TEMP/GYDT-Sample-Results-Importer-v1.0.6.zip"

      - name: Retain the verified production-importer ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gydt-production-importer
          path: ${{ runner.temp }}/GYDT-Sample-Results-Importer-v1.0.6.zip
          if-no-files-found: error
          retention-days: 7
